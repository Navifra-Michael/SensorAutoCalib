reference_lidar: lidar_1

ndt:
  resolution: 0.2
  min_points_per_cell: 10
  downsample_voxel: 0.01

search:
  stages:
    - range_x: 0.40
      range_y: 0.40
      range_yaw_deg: 10.0
      step_x: 0.1
      step_y: 0.1
      step_yaw_deg: 1.0

    - range_x: 0.20
      range_y: 0.20
      range_yaw_deg: 5.0
      step_x: 0.05
      step_y: 0.05
      step_yaw_deg: 1.0

    # - range_x: 0.02
    #   range_y: 0.02
    #   range_yaw_deg: 1.0
    #   step_x: 0.002
    #   step_y: 0.002
    #   step_yaw_deg: 0.1

    - range_x: 0.01
      range_y: 0.01
      range_yaw_deg: 0.5
      step_x: 0.001
      step_y: 0.001
      step_yaw_deg: 0.05
