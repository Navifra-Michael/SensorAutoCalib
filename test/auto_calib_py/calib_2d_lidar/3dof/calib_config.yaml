reference_lidar: lidar_1
collect_duration_sec: 5.0
output_dir: output
output_yaml: calibrated_output.yaml
calibrated_config_yaml: calibrated_config.yaml
before_plot_png: before_calibration.png
after_plot_png: after_calibration.png

plot:
  backend: TkAgg
  show_lidar_arrows: true
  show_robot_frame: true
  show_ndt_grid: false
  show_default_grid: true
  show_live_ndt: true
  live_update_interval_sec: 1.0
  live_max_points: 2000
  keep_live_ndt_open: true
  lidar_label_font_size: 10

ndt:
  resolution: 0.2
  min_points_per_cell: 10
  downsample_voxel: 0.01

search:
  stages:
    - range_x: 0.25
      range_y: 0.25
      range_yaw_deg: 10.0
      step_x: 0.05
      step_y: 0.05
      step_yaw_deg: 1.0

    # - range_x: 0.08
    #   range_y: 0.08
    #   range_yaw_deg: 4.0
    #   step_x: 0.01
    #   step_y: 0.01
    #   step_yaw_deg: 0.5

    # - range_x: 0.02
    #   range_y: 0.02
    #   range_yaw_deg: 1.0
    #   step_x: 0.002
    #   step_y: 0.002
    #   step_yaw_deg: 0.1

    - range_x: 0.01
      range_y: 0.01
      range_yaw_deg: 0.5
      step_x: 0.001
      step_y: 0.001
      step_yaw_deg: 0.05