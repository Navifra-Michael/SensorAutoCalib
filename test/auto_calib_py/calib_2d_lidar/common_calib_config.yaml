collect_duration_sec: 5.0
output_dir: output
output_yaml: calibrated_output.yaml
calibrated_config_yaml: calibrated_config.yaml
graph_data_npz: calibration_graph_data.npz
collection_cache_npz: collection_cache.npz
before_plot_png: before_calibration.png
after_plot_png: after_calibration.png

collection:
  saved_data_fallback: true
  saved_data_timeout_sec: 5.0
  zero_roll_pitch_for_filter: true
  sample_mode: time_interval # all, time_interval
  sample_interval_sec: 0.5
  overlap_filter_voxel: 0.005
  stable_filter:
    enabled: true
    voxel: 0.02
    min_observations: 2
    min_odom_translation: 0.02
    min_odom_yaw_deg: 0.5
  odom_lookup_mode: timestamp
  odom_interpolation: true
  odom_max_time_diff_sec: 0.1
  odom_buffer_sec: 10.0

odom_noisy:
  enabled: true
  input_topic: /navi_robot_1/odom
  output_topic: /navi_robot_1/odom_noisy
  use_output_topic_for_calibration: false
  noise_mode: both # none, jitter, drift, both
  seed: -1
  apply_to_twist: false
  jitter:
    frame_interval: 1 # 1 means update jitter every odom frame
    position_std: [0.002, 0.002, 0.00] # meter
    rpy_std: [0.0, 0.0, 0.005] # rad
  drift:
    reference_distance_m: 1.0 # accumulated drift reaches the values below after this distance
    position_error_at_reference: [0.001, 0.0005, 0.0] # meter after reference_distance_m
    rpy_error_at_reference: [0.0, 0.0, 0.0] # rad after reference_distance_m
    position_random_walk_std: [0.0, 0.0, 0.0] # meter / sqrt(reference_distance_m)
    rpy_random_walk_std: [0.0, 0.0, 0.0] # rad / sqrt(reference_distance_m)
    max_abs_position: [0.0, 0.0, 0.0] # 0 disables clamp
    max_abs_rpy: [0.0, 0.0, 0.0] # 0 disables clamp

plot:
  backend: TkAgg
  show_lidar_arrows: true
  show_robot_frame: true
  show_ndt_grid: false
  show_default_grid: true
  show_live_ndt: true
  show_collection_live_plot: true
  show_result_plot: true
  keep_result_plot_open: true
  live_update_interval_sec: 0.5
  live_max_points: -1
  keep_live_ndt_open: true
  lidar_label_font_size: 10
  max_points: -1
