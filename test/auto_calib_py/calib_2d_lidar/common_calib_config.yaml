collect_duration_sec: 5.0
output_dir: output
output_yaml: calibrated_output.yaml
calibrated_config_yaml: calibrated_config.yaml
graph_data_npz: calibration_graph_data.npz
collection_cache_npz: collection_cache.npz
before_plot_png: before_calibration.png
after_plot_png: after_calibration.png

collection:
  saved_data_fallback: true
  saved_data_timeout_sec: 5.0
  zero_roll_pitch_for_filter: true
  sample_mode: time_interval # all, time_interval
  sample_interval_sec: 0.5
  overlap_filter_voxel: 0.005
  stable_filter:
    enabled: true
    voxel: 0.02
    min_observations: 2
    min_odom_translation: 0.02
    min_odom_yaw_deg: 0.5
  odom_lookup_mode: timestamp
  odom_interpolation: true
  odom_max_time_diff_sec: 0.1
  odom_buffer_sec: 10.0

plot:
  backend: TkAgg
  show_lidar_arrows: true
  show_robot_frame: true
  show_ndt_grid: false
  show_default_grid: true
  show_live_ndt: true
  show_collection_live_plot: true
  show_result_plot: true
  keep_result_plot_open: true
  live_update_interval_sec: 0.5
  live_max_points: -1
  keep_live_ndt_open: true
  lidar_label_font_size: 10
  max_points: -1
