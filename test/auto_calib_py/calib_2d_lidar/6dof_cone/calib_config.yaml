collect_duration_sec: 5.0

# Processing mode. Realtime uses only the newest LaserScan frame; it does not
# accumulate scans or compute a temporal median. Close the window or press
# Ctrl+C to stop.
realtime:
  enabled: true
  update_interval_sec: 0.1
  # Faster single-frame RANSAC for realtime display. The normal stationary
  # mode continues to use circle.ransac_iterations below.
  ransac_iterations: 300
  # Local Matplotlib updates on every result; heavier Plotly 3D updates at
  # this independent rate.
  plotly_update_interval_sec: 0.1
  # Listen on every interface so the page is reachable through Docker port
  # forwarding (for example: docker run -p 8050:8050 ...).
  plotly_host: 0.0.0.0
  plotly_port: 8050
  # Hostname printed in the URL for the browser running on the Docker host.
  plotly_public_host: localhost
  # Do not write results while running. On exit, only the last fully successful
  # calibration is written to output_yaml and calibrated_config_yaml.
  save_final_result: true

output_dir: output
output_yaml: calibrated_output.yaml
calibrated_config_yaml: calibrated_config.yaml

# Physical dimensions of every calibration cone.
cone:
  radius_m: 0.5
  height_m: 1.0

# Only returns in this radial distance interval are considered.
range_filter:
  min_m: 0.5
  max_m: 7.0

# Consecutive LaserScan points are split into object candidates.
clustering:
  gap_m: 0.08
  min_points: 10
  # Must exceed the visible arc chord. For radius 0.5 m and a 90-degree arc,
  # the chord is about 0.707 m; 1.2 m allows the full 1.0 m cone diameter.
  max_width_m: 1.20

# Circle extraction from each object candidate.
circle:
  min_radius_m: 0.015
  inlier_threshold_m: 0.01
  min_inliers: 5
  ransac_iterations: 500
  random_seed: 0

# A plane requires at least three non-collinear cone centers.
quality:
  min_cones: 3
  max_circle_rmse_m: 0.01
  max_plane_rmse_m: 0.02

# Visualize each LiDAR's scan/circles and inferred 3D center plane.
plot:
  enabled: true
  # Opens the interactive 3D HTML plot in the default browser.
  # false: save PNG/HTML only, without opening windows or a browser.
  show: true
  # The Matplotlib PNG is saved for diagnostics; normally do not open it.
  show_2d: true
  output_png: cone_calibration.png
  # Vertical robot-z limits of the YZ projection.
  yz_z_min_m: 0.0
  yz_z_max_m: 2.0
  # Displayed unit-length ratio: horizontal robot-y : vertical robot-z = 1 : 2.
  yz_z_to_y_scale: 2.0
  interactive_3d: true
  output_html: cone_calibration_3d.html
  combined_output_html: cone_calibration_3d_combined.html
  # Robot-frame XY distance used to merge detections of the same physical cone.
  combined_cone_merge_distance_m: 0.6
  max_points: 5000
  dpi: 150
