reference_lidar: lidar_2
collect_duration_sec: 20.0
require_odom: true
match_mode: initial_scan_overlap_then_reference_alignment
feedback_calib_count: 0

result_plot_png: overlap_calibration_result.png
before_plot_png: before_calib.png
after_plot_png: after_calib.png

plot:
  show_result_plot: false
  keep_result_plot_open: false
  keep_live_ndt_open: false
  separate_initial_overlap_plots: true

ndt:
  resolution: 0.5
  min_points_per_cell: 5
  downsample_voxel: 0.04
  score_projection: xy
  self_score_projection: xy

initial_overlap:
  enabled: true
  parallel: true
  max_workers: 2
  scan_stride: 1
  max_scans: 0
  score_metric: pca_xy_tilt+0.001
  thickness_method: pca_line
  fixed_grid: true
  min_score_improvement_ratio: 0.0
  resolution: 0.1
  min_points_per_cell: 3
  score_projection: xy
  stages:
    - mode: full_grid
      range_roll_deg: 7
      range_pitch_deg: 7
      step_roll_deg: 0.2
      step_pitch_deg: 0.2
    # - mode: axis_sequential
    #   axis_order: [yaw, roll, pitch]
    #   passes: 2
    #   range_roll_deg: 2.5
    #   range_pitch_deg: 2.5
    #   # range_yaw_deg: 2.5
    #   step_roll_deg: 0.025
    #   step_pitch_deg: 0.025
    #   # step_yaw_deg: 0.05

    # - mode: axis_sequential
    #   axis_order: [yaw, roll, pitch]
    #   passes: 2
    #   range_roll_deg: 1.0
    #   range_pitch_deg: 1.0
    #   # range_yaw_deg: 1.0
    #   step_roll_deg: 0.01
    #   step_pitch_deg: 0.01
    #   # step_yaw_deg: 0.01

reference_alignment:
  enabled: false
  score_projection: xy
  project_cloud_to_xy: true
  stages:
    - axes: [x, y, yaw]
      range_x: 0.03
      range_y: 0.03
      range_yaw_deg: 3.0
      step_x: 0.005
      step_y: 0.005
      step_yaw_deg: 0.5

    - axes: [x, y, yaw]
      range_x: 0.01
      range_y: 0.01
      range_yaw_deg: 1.0
      step_x: 0.002
      step_y: 0.002
      step_yaw_deg: 0.1

    # - axes: [roll, pitch]
    #   range_roll_deg: 2.5
    #   range_pitch_deg: 2.5
    #   step_roll_deg: 0.1
    #   step_pitch_deg: 0.1

    # - axes: [roll, pitch]
    #   range_roll_deg: 1.0
    #   range_pitch_deg: 1.0
    #   step_roll_deg: 0.05
    #   step_pitch_deg: 0.05
